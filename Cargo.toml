[package]
name = "eomc-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
rmcp           = { version = "0.17", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
tokio          = { version = "1", features = ["full"] }
axum           = "0.8"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
schemars       = { version = "1.0", features = ["chrono04"] }
reqwest        = { version = "0.12", features = ["json"] }
chrono         = { version = "0.4", features = ["serde"] }
anyhow         = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy        = "0.15"
toml           = "0.8"
